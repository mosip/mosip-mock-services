# Local profile for mock-mv (run-local.sh / run-local.bat).
# Activate with: -Dspring.profiles.active=local
# No config-server required; ActiveMQ defaults point at localhost:61616.

server.port=8081
server.servlet.context-path=/v1/mockmv

# Boot 4 local run (no config-server, no Micrometer tracing)
spring.cloud.config.enabled=false
spring.cloud.config.fail-fast=false
spring.config.import=optional:configserver:
spring.sleuth.enabled=false

# Avoid health hanging when local ActiveMQ is down (JmsHealthIndicator opens a broker connection)
management.health.jms.enabled=false
management.health.config.enabled=false

# Local ActiveMQ defaults (override via env / config server when not local)
registration.processor.manual.adjudication.queue.url=tcp://localhost:61616
registration.processor.manual.adjudication.queue.username=admin
registration.processor.manual.adjudication.queue.password=admin
registration.processor.verification.queue.url=tcp://localhost:61616
registration.processor.verification.queue.username=admin
registration.processor.verification.queue.password=admin
registration.processor.queue.typeOfQueue=ACTIVEMQ
registration.processor.queue.manual.adjudication.request=mosip-to-adjudication
registration.processor.queue.manual.adjudication.response=adjudication-to-mosip
registration.processor.queue.verification.request=mosip-to-verification
registration.processor.queue.verification.response=verification-to-mosip
mock.mv.default.decision=APPROVED
mock.mv.success=true
