<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MockMDS Admin API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fafafa; }
  </style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function () {
      // Always load OpenAPI from this origin so Try-it-out uses the bound port
      // (4501–4600 first free), not a stale/hardcoded port.
      var docsUrl = window.location.origin + '/v3/api-docs';
      window.ui = SwaggerUIBundle({
        url: docsUrl,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'StandaloneLayout',
        tryItOutEnabled: true
      });
    };
  </script>
</body>
</html>
