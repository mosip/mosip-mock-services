name: Maven Package upon a push

on:
  release:
    types: [published]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      message:
        description: "Message for manually triggering"
        required: false
        default: "Triggered for Updates"
        type: string
  push:
    branches:
      - "!release-branch"
      - release-1*
      - master
      - 1.*
      - develop*
      - MOSIP*
      - issue*

jobs:
  build-maven-mock-components:
    uses: mosip/kattu/.github/workflows/maven-build.yml@develop
    with:
      SERVICE_LOCATION: ./
      BUILD_ARTIFACT: mockcomponents
    secrets:
      OSSRH_USER: ${{ secrets.OSSRH_USER }}
      OSSRH_SECRET: ${{ secrets.OSSRH_SECRET }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      GPG_SECRET: ${{ secrets.GPG_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  build-dockers-mock-abis:
    needs: build-maven-mock-components
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: "."
            SERVICE_NAME: "mock-abis"
            BUILD_ARTIFACT: "mockcomponents"
            SQUASH_LAYERS: "12"
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    uses: mosip/kattu/.github/workflows/docker-build.yml@develop
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}
      SQUASH_LAYERS: ${{ matrix.SQUASH_LAYERS }}
    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  build-dockers-mock-mv:
    needs: build-maven-mock-components
    strategy:
      matrix:
        include:
          - SERVICE_LOCATION: "."
            SERVICE_NAME: "mock-mv"
            BUILD_ARTIFACT: "mockcomponents"
            SQUASH_LAYERS: "12"
      fail-fast: false
    name: ${{ matrix.SERVICE_NAME }}
    uses: mosip/kattu/.github/workflows/docker-build.yml@develop
    with:
      SERVICE_LOCATION: ${{ matrix.SERVICE_LOCATION }}
      SERVICE_NAME: ${{ matrix.SERVICE_NAME }}
      BUILD_ARTIFACT: ${{ matrix.BUILD_ARTIFACT }}
      SQUASH_LAYERS: ${{ matrix.SQUASH_LAYERS }}
    secrets:
      DEV_NAMESPACE_DOCKER_HUB: ${{ secrets.DEV_NAMESPACE_DOCKER_HUB }}
      ACTOR_DOCKER_HUB: ${{ secrets.ACTOR_DOCKER_HUB }}
      RELEASE_DOCKER_HUB: ${{ secrets.RELEASE_DOCKER_HUB }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  publish_to_nexus_mockcomponents:
    if: "${{ !contains(github.ref, 'master') && github.event_name != 'pull_request' && github.event_name != 'release' && github.event_name != 'prerelease' && github.event_name != 'publish' }}"
    needs: build-maven-mock-components
    uses: mosip/kattu/.github/workflows/maven-publish-to-nexus.yml@develop
    with:
      SERVICE_LOCATION: ./
    secrets:
      OSSRH_USER: ${{ secrets.OSSRH_USER }}
      OSSRH_SECRET: ${{ secrets.OSSRH_SECRET }}
      OSSRH_URL: ${{ secrets.OSSRH_CENTRAL_URL }}
      OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
      GPG_SECRET: ${{ secrets.GPG_SECRET }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ---------------------------------------------------------------------------
  # SonarCloud analysis is intentionally disabled for this repository.
  #
  # mosip-mock-services only hosts mock / reference implementations and is not
  # in scope for SonarCloud quality-gate tracking. As confirmed with the
  # architect, Sonar analysis is not required here, and these jobs were failing
  # on every post-merge run. They are commented out (kept for reference) rather
  # than deleted, so they can be re-enabled quickly if that decision changes.
